workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^ci\/(batch|local)-/
    - if: $CI_COMMIT_TAG

default:
  tags: [docker]

check:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.20
  timeout: 5m
  variables:
    GIT_DEPTH: "0"
  script:
    - apk add --no-cache git >/dev/null
    - base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-${CI_COMMIT_BEFORE_SHA:-}}"
    - |
      if [ "$base" = "0000000000000000000000000000000000000000" ]; then
        if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
          echo "cannot identify a root commit in a shallow clone" >&2
          exit 1
        fi
        head=$(git rev-parse HEAD) || exit 1
        ancestry=$(git rev-list --parents -n 1 HEAD) || exit 1
        if [ "$ancestry" = "$head" ]; then
          echo "root commit: no previous commit"
          exit 0
        fi
        base=$(git rev-parse --verify HEAD^) || exit 1
      fi
      if [ -z "$base" ]; then
        echo "missing diff base" >&2
        exit 1
      elif ! git cat-file -e "$base^{commit}" 2>/dev/null; then
        echo "diff base is not available in the full clone" >&2
        exit 1
      else
        git diff --check "$base" HEAD
      fi


.php:
  retry:
    max: 1
    exit_codes: [100]
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/chialab/php:${W3_PHP_VERSION}
  timeout: 20m
  variables:
    W3_PHP_VERSION: "8.2"
    COMPOSER_ALLOW_SUPERUSER: "1"
    COMPOSER_NO_INTERACTION: "1"
  before_script:
    - php --version
    - php -r 'if (PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION !== getenv("W3_PHP_VERSION")) { fwrite(STDERR, "Unexpected PHP runtime\n"); exit(1); }'
    - |
      case "$W3_PHP_VERSION" in
        7.0)
          w3_composer_version=2.2.25
          w3_composer_sha=8b3f41253363f0645402d1951d6e7f02adedeef29c16de6074763e463e25c23f
          ;;
        *)
          w3_composer_version=2.10.3
          w3_composer_sha=7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6
          ;;
      esac
      curl --fail --silent --show-error --location "https://getcomposer.org/download/$w3_composer_version/composer.phar" --output "$CI_PROJECT_DIR/.ci-composer.phar"
      printf '%s  %s\n' "$w3_composer_sha" "$CI_PROJECT_DIR/.ci-composer.phar" | sha256sum --check --status
      composer() { php "$CI_PROJECT_DIR/.ci-composer.phar" "$@"; }
      export COMPOSER_HOME="$CI_PROJECT_DIR/.ci-composer-home"
      mkdir -p "$COMPOSER_HOME"
      chmod 0700 "$COMPOSER_HOME"
      composer --version

tests:
  extends: .php
  parallel:
    matrix:
      - W3_LARAVEL_VERSION: ["10", "11"]
  script:
    - composer require "laravel/framework:^$W3_LARAVEL_VERSION.0" --no-interaction --prefer-dist --no-progress
    - vendor/bin/pest

phpstan:
  extends: .php
  script:
    - composer install --prefer-dist --no-interaction --no-progress
    - vendor/bin/phpstan analyse --no-progress --memory-limit=1G

style:
  extends: .php
  script:
    - composer global require friendsofphp/php-cs-fixer --prefer-dist --no-interaction --no-progress
    - php "$COMPOSER_HOME/vendor/bin/php-cs-fixer" fix --config=.php-cs-fixer.php --dry-run --diff --using-cache=no
