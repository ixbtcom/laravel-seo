name: CI

on:
  push:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  pest:
    name: Tests (Pest) Laravel 13 / PHP ${{ matrix.php }}
    runs-on: [self-hosted, Linux, X64, docker]
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:2.11.1
          extensions: imagick
          coverage: none
      - name: Install composer dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Audit dependencies
        run: composer audit --locked --format=json > composer-audit.json
      - name: Show tested framework
        run: composer show laravel/framework
      - name: Run tests
        run: vendor/bin/pest --log-junit junit.xml
      - name: Upload test and audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-tests-php${{ matrix.php }}
          path: |
            composer-audit.json
            junit.xml

  phpstan:
    name: Static analysis (PHPStan)
    runs-on: [self-hosted, Linux, X64, docker]
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:2.11.1
          coverage: none
      - name: Install composer dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Audit dependencies
        run: composer audit --locked --format=json > composer-audit.json
      - name: Run phpstan
        run: vendor/bin/phpstan analyse --memory-limit=1G
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-phpstan-audit
          path: composer-audit.json

  php-cs-fixer:
    name: Code style (php-cs-fixer)
    runs-on: [self-hosted, Linux, X64, docker]
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:2.11.1
          coverage: none
      - name: Install composer dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Audit dependencies
        run: composer audit --locked --format=json > composer-audit.json
      - name: Run php-cs-fixer
        run: vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.php --dry-run --diff --using-cache=no
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-style-audit
          path: composer-audit.json
